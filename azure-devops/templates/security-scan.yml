# Security Scanning Template
# Runs Checkov and Trivy security scans

parameters:
- name: requestId
  type: string
- name: workingDirectory
  type: string
- name: scanType
  type: string
  values:
  - checkov
  - trivy
- name: failOnCritical
  type: boolean
  default: true

steps:
- checkout: self
  displayName: 'Checkout Repository'

- ${{ if eq(parameters.scanType, 'checkov') }}:
  - script: |
      echo "Installing Checkov..."
      pip install checkov
      checkov --version
    displayName: 'Install Checkov'

  - script: |
      cd ${{ parameters.workingDirectory }}
      
      echo "Running Checkov security scan..."
      checkov --directory . \
        --output json \
        --output-file-path checkov-results.json \
        --framework terraform \
        --compact \
        --quiet
      
      # Always show results even if scan fails
      EXIT_CODE=$?
      
      echo "Checkov scan completed with exit code: $EXIT_CODE"
      
      # Parse results
      if [ -f checkov-results.json ]; then
        echo "Checkov Results Summary:"
        jq -r '.summary' checkov-results.json || echo "No summary available"
        
        # Check for critical/high severity issues
        CRITICAL_COUNT=$(jq '[.results.failed_checks[] | select(.check_class | contains("CKV"))] | length' checkov-results.json)
        echo "Critical/High severity issues: $CRITICAL_COUNT"
        
        if [ "$CRITICAL_COUNT" -gt 0 ] && [ "${{ parameters.failOnCritical }}" = "True" ]; then
          echo "##vso[task.logissue type=error]Critical security issues detected"
          jq -r '.results.failed_checks[] | "[\(.severity)] \(.check_id): \(.check_name)\n  Resource: \(.resource)\n  File: \(.file_path):\(.file_line_range[0])\n"' checkov-results.json
          exit 1
        fi
      fi
    displayName: 'Run Checkov Scan'
    continueOnError: ${{ not(parameters.failOnCritical) }}

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Checkov Results'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/checkov-results.json'
      artifact: 'checkov-results-${{ parameters.requestId }}'
      publishLocation: 'pipeline'
    condition: always()

- ${{ if eq(parameters.scanType, 'trivy') }}:
  - script: |
      echo "Installing Trivy..."
      wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
      echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
      sudo apt-get update
      sudo apt-get install trivy -y
      trivy --version
    displayName: 'Install Trivy'

  - script: |
      cd ${{ parameters.workingDirectory }}
      
      echo "Running Trivy vulnerability scan..."
      trivy config . \
        --format json \
        --output trivy-results.json \
        --severity CRITICAL,HIGH,MEDIUM \
        --exit-code 0
      
      echo "Trivy scan completed"
      
      # Parse results
      if [ -f trivy-results.json ]; then
        echo "Trivy Results Summary:"
        
        CRITICAL_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
        HIGH_COUNT=$(jq '[.Results[]?.Misconfigurations[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
        
        echo "Critical issues: $CRITICAL_COUNT"
        echo "High issues: $HIGH_COUNT"
        
        if [ "$CRITICAL_COUNT" -gt 0 ] && [ "${{ parameters.failOnCritical }}" = "True" ]; then
          echo "##vso[task.logissue type=error]Critical vulnerabilities detected"
          jq -r '.Results[]?.Misconfigurations[]? | select(.Severity == "CRITICAL") | "[\(.Severity)] \(.ID): \(.Title)\n  \(.Description)\n"' trivy-results.json
          exit 1
        fi
      fi
    displayName: 'Run Trivy Scan'
    continueOnError: ${{ not(parameters.failOnCritical) }}

  - task: PublishPipelineArtifact@1
    displayName: 'Publish Trivy Results'
    inputs:
      targetPath: '${{ parameters.workingDirectory }}/trivy-results.json'
      artifact: 'trivy-results-${{ parameters.requestId }}'
      publishLocation: 'pipeline'
    condition: always()

- task: PowerShell@2
  displayName: 'Update Security Scan Status'
  inputs:
    targetType: 'inline'
    script: |
      $requestId = "${{ parameters.requestId }}"
      $scanType = "${{ parameters.scanType }}"
      $apiUrl = "$(BACKEND_API_URL)/api/v1/deployments/$requestId/security"
      
      # Read results file
      $resultsFile = "${{ parameters.workingDirectory }}/$scanType-results.json"
      $results = Get-Content $resultsFile | ConvertFrom-Json
      
      $body = @{
        scan_type = $scanType
        status = "COMPLETED"
        results = $results
        pipeline_run_id = "$(Build.BuildId)"
      } | ConvertTo-Json -Depth 10
      
      try {
        Invoke-RestMethod -Uri $apiUrl -Method POST -Body $body -ContentType "application/json"
        Write-Host "Security scan results uploaded"
      } catch {
        Write-Warning "Failed to upload results: $_"
      }
  condition: always()
